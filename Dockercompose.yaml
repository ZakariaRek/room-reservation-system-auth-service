version: '3.8'

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins-server
    privileged: true
    user: root
    ports:
      - "8099:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - jenkins-network

  trivy:
    image: aquasec/trivy:latest
    container_name: trivy-scanner
    volumes:
      - trivy-cache:/root/.cache/
    networks:
      - jenkins-network

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb_spring
    ports:
      - "3307:3306"  # Using 3307 to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jenkins-network

volumes:
  jenkins_home:
  trivy-cache:
  mysql_data:

networks:
  jenkins-network:
    driver: bridge